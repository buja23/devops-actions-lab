name: CI Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Instalar dependências
        run: npm ci
        
      - name: Executar Linter
        run: npx eslint .
        
      - name: Executar Testes Unitários
        run: npm test